crons:
  - name: weekly-digest
    description: "Emails opted-in users their weekly AegisShield safety summary every Monday 9am UTC"
    cron: "0 9 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
