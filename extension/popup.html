<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 330px; margin: 0; background: #070a12; color: #f8fafc; font: 13px system-ui, sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 8px; }
    header b { font-size: 15px; }
    main { padding: 16px; }
    .score { font-size: 46px; font-weight: 800; line-height: 1; }
    .bar { height: 8px; background: #1e293b; border-radius: 6px; overflow: hidden; margin: 10px 0; }
    .fill { height: 100%; width: 0; transition: width .6s; }
    .host { color: #94a3b8; font-family: monospace; font-size: 11px; word-break: break-all; }
    ul { padding-left: 16px; margin: 10px 0; color: #cbd5e1; }
    li { margin-bottom: 4px; }
    button { background: #06b6d4; color: #04121a; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
    details { margin-top: 14px; border-top: 1px solid #1e293b; padding-top: 10px; color: #94a3b8; }
    input[type=text] { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; padding: 6px; margin: 4px 0 8px; }
  </style>
</head>
<body>
  <header><span style="color:#06b6d4;font-size:18px">&#x1F6E1;</span><b>AgeinsShield</b></header>
  <main>
    <div id="status">Scanning this page...</div>
    <div id="result" style="display:none">
      <div class="score" id="score"></div>
      <div id="verdict" style="font-weight:700;margin-top:4px"></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="host" id="host"></div>
      <div class="host" id="age"></div>
      <ul id="flags"></ul>
    </div>
    <button id="rescan">Rescan</button>
    <button id="trust" style="background:#10B981;margin-left:6px">Trust this site</button>
    <details>
      <summary>Settings</summary>
      <label>API server URL</label>
      <input type="text" id="apiBase" />
      <label><input type="checkbox" id="alarmOn" /> Fraud alarm enabled</label><br />
      <label>Alarm when score below <input type="text" id="threshold" style="width:40px" /></label><br /><br />
      <button id="save">Save settings</button>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
